      <div id="page-av-repair" class="page-section hidden">
        <div class="flex items-center justify-center min-h-[70vh] py-6">
          <div class="bg-white w-full max-w-2xl rounded-3xl shadow-sm p-6 sm:p-8 border border-slate-200">
            <button onclick="nav('page-home')"
              class="text-[#f59e0b] font-bold mb-4 hover:text-[#d97706] transition-colors text-sm inline-flex items-center gap-1.5">
              <i class="fa-solid fa-arrow-left"></i> <span>กลับหน้าหลัก</span>
            </button>
            <div class="text-center mb-6">
              <div
                class="w-14 h-14 bg-[#fef3c7] text-[#f59e0b] rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                <i class="fa-solid fa-microphone"></i>
              </div>
              <h2 class="text-2xl font-bold text-slate-800">แจ้งซ่อมอุปกรณ์โสตทัศนศึกษา</h2>
              <p class="text-xs text-slate-500 mt-1">แจ้งปัญหาเครื่องเสียง โปรเจคเตอร์ หรืออุปกรณ์โสตฯ ที่ชำรุด</p>
            </div>
            <form id="avRepForm" class="space-y-4" onsubmit="event.preventDefault(); submitAvRepair();">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อผู้แจ้ง <span class="text-rose-500">*</span></label>
                <input type="text" id="avRepReporter" placeholder="เช่น สมชาย ใจดี"
                  class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm font-medium"
                  required>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">หน่วยงาน / แผนก</label>
                  <input type="text" id="avRepDepartment" placeholder="ถ้ามี เช่น ฝ่ายวิชาการ"
                    class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">สถานที่ / ห้อง</label>
                  <div class="flex gap-2">
                    <input type="text" id="avRepLocation" placeholder="เช่น หอประชุมใหญ่"
                      class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm">
                    <button type="button" onclick="openQrScanner('avRepLocation')" class="bg-[#fef3c7] hover:bg-[#f59e0b] hover:text-white text-[#f59e0b] px-4 rounded-xl transition-colors shadow-sm flex items-center justify-center shrink-0">
                      <i class="fa-solid fa-qrcode text-lg"></i>
                    </button>
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ปัญหาเกี่ยวกับอะไร <span class="text-rose-500">*</span></label>
                <select id="avRepSubject" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm font-medium" required>
                  <option value="เครื่องเสียง / ไมโครโฟน / ลำโพง">เครื่องเสียง / ไมโครโฟน / ลำโพง</option>
                  <option value="โปรเจคเตอร์ / จอรับภาพ">โปรเจคเตอร์ / จอรับภาพ</option>
                  <option value="โทรทัศน์ / จอ LED">โทรทัศน์ / จอ LED</option>
                  <option value="กล้องถ่ายรูป / กล้องวิดีโอ">กล้องถ่ายรูป / กล้องวิดีโอ</option>
                  <option value="สายสัญญาณ / อุปกรณ์เชื่อมต่อ">สายสัญญาณ / อุปกรณ์เชื่อมต่อ</option>
                  <option value="อื่นๆ">อื่นๆ</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ความเร่งด่วน <span class="text-rose-500">*</span></label>
                <div class="grid grid-cols-3 gap-2">
                  <label class="flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors has-[:checked]:border-rose-500 has-[:checked]:bg-rose-50/50 has-[:checked]:text-rose-700">
                    <input type="radio" name="avRepUrgency" value="ด่วน" class="sr-only">
                    <span class="text-sm font-bold flex items-center gap-1">🔴 ด่วน</span>
                    <span class="text-[10px] text-slate-400 mt-0.5 text-center">กระทบงานกิจกรรม</span>
                  </label>
                  <label class="flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors has-[:checked]:border-[#f59e0b] has-[:checked]:bg-[#fef3c7]/30 has-[:checked]:text-[#f59e0b]">
                    <input type="radio" name="avRepUrgency" value="ตามคิว" checked class="sr-only">
                    <span class="text-sm font-bold flex items-center gap-1">🔵 ตามคิว</span>
                    <span class="text-[10px] text-slate-400 mt-0.5 text-center">งานทั่วไป</span>
                  </label>
                  <label class="flex flex-col items-center justify-center p-2.5 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50/50 has-[:checked]:text-emerald-700">
                    <input type="radio" name="avRepUrgency" value="ไม่รีบ" class="sr-only">
                    <span class="text-sm font-bold flex items-center gap-1">🟢 ไม่รีบ</span>
                    <span class="text-[10px] text-slate-400 mt-0.5 text-center">ดำเนินการภายหลัง</span>
                  </label>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold text-slate-700 mb-1">วันที่/เวลาที่พบปัญหา <span class="text-slate-400 font-normal">(ถ้าจำได้)</span></label>
                  <input type="datetime-local" id="avRepIncidentDate"
                    class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">รายละเอียดปัญหา <span class="text-rose-500">*</span></label>
                <textarea id="avRepDetail" rows="3" placeholder="บอกรายละเอียดเพิ่มเติม เช่น ไมค์หอน ภาพไม่ติด"
                  class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm" required></textarea>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">เบอร์โทรศัพท์ หรือช่องทางติดต่อกลับ</label>
                <input type="text" id="avRepContact" placeholder="เช่น 081-234-5678 หรือ LINE ID"
                  class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#f59e0b] bg-slate-50 text-sm">
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">รูปภาพประกอบ (ถ้ามี)</label>
                <input type="file" id="avRepFile" accept="image/*" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#fef3c7] file:text-[#f59e0b] hover:file:bg-[#f59e0b] hover:file:text-white file:transition-colors">
              </div>

              <button type="button" onclick="submitAvRepair()" id="btnSubmitAvRepair"
                class="w-full bg-[#f59e0b] hover:bg-[#d97706] text-white font-bold py-3.5 rounded-xl flex justify-center items-center gap-2 transition-all shadow-md active:scale-[0.99] mt-2">
                <i class="fa-solid fa-paper-plane"></i> <span>ส่งแจ้งซ่อมโสตฯ</span>
              </button>
            </form>
          </div>
        </div>
      </div>
