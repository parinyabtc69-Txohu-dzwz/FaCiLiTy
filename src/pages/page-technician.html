      <div id="page-technician" class="page-section">
        <div class="max-w-7xl mx-auto">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-toolbox text-blue-600"></i>
                จัดการงานซ่อม</h1>
              <p class="text-xs text-slate-500 mt-1">งานที่ยังไม่เสร็จจะถูกดันขึ้นด้านบน (ติดดาว ⭐ และป้ายสีแดง)
                เรียงตามเวลาเก่าไปใหม่ งานที่เสร็จแล้วจะติดป้ายสีฟ้าและดันลงด้านล่าง</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
                <input type="text" oninput="window.currentRepairSearch = this.value; window.renderRepairTable();"
                  class="pl-9 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64"
                  placeholder="ค้นหาจากรายละเอียดปัญหา...">
              </div>
              <button onclick="loadBuildingTasks()"
                class="bg-white border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-50 shadow-sm transition-colors"><i
                  class="fa-solid fa-rotate mr-1"></i> รีเฟรช</button>
              <button onclick="exportTableToCSV('taskBody', 'รายงานงานซ่อม.csv')"
                class="bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl text-sm font-bold text-emerald-700 hover:bg-emerald-100 shadow-sm transition-colors hidden sm:block"><i
                  class="fa-solid fa-file-csv mr-1"></i> ส่งออก CSV</button>
            </div>
          </div>
          
          <div class="flex items-center gap-2 mb-2 p-1 border-b border-slate-200">
    <div class="gmail-toolbar-btn ml-1"><div class="w-4 h-4 border-2 border-slate-400 rounded"></div></div>
    <div class="gmail-toolbar-btn" title="รีเฟรช"><i class="fa-solid fa-rotate text-slate-600"></i></div>
    <div class="gmail-toolbar-btn" title="เพิ่มเติม"><i class="fa-solid fa-ellipsis-vertical text-slate-600"></i></div>
    <div class="flex-1"></div>
    <span class="text-xs text-slate-500 mr-2 font-medium">1-50 of หลายรายการ</span>
  </div>
  <div class="flex flex-wrap items-center gap-3 mb-0 bg-transparent p-1 rounded-xl hidden">
            <span class="text-sm font-semibold text-slate-600"><i class="fa-solid fa-filter mr-1"></i> กรองข้อมูล:</span>
            <select id="repairFilterDate" onchange="window.currentRepairDate = this.value; window.renderRepairTable();" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="">ทุกช่วงเวลา</option>
              <option value="today">วันนี้</option>
              <option value="week">สัปดาห์นี้</option>
              <option value="month">เดือนนี้</option>
            </select>
            <input type="text" id="repairFilterReporter" oninput="window.currentRepairReporter = this.value; window.renderRepairTable();" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-32 sm:w-40 bg-white" placeholder="ชื่อผู้แจ้ง...">
            <input type="text" id="repairFilterLocation" oninput="window.currentRepairLocation = this.value; window.renderRepairTable();" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-32 sm:w-40 bg-white" placeholder="สถานที่...">
          </div>
          
          <div class="flex gap-2 border-b border-slate-200 mb-4 overflow-x-auto" id="repairAdminTabs">
            <button class="px-4 py-3 font-semibold text-slate-600 gmail-tab active whitespace-nowrap" onclick="filterRepairTab('all', this)">ทั้งหมด</button>
            <button class="px-4 py-3 font-semibold text-slate-500 hover:bg-slate-50 gmail-tab whitespace-nowrap" onclick="filterRepairTab('pending', this)">รอดำเนินการ</button>
            <button class="px-4 py-3 font-semibold text-slate-500 hover:bg-slate-50 gmail-tab whitespace-nowrap" onclick="filterRepairTab('progress', this)">กำลังดำเนินการ</button>
            <button class="px-4 py-3 font-semibold text-slate-500 hover:bg-slate-50 gmail-tab whitespace-nowrap" onclick="filterRepairTab('done', this)">เสร็จสิ้น</button>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div id="taskBody" class="flex flex-col divide-y divide-slate-100">
              <div class="p-8 text-center text-slate-500">กำลังโหลดข้อมูล...</div>
            </div>
          </div>
        </div>
      </div>
