      <div id="page-project-manage" class="page-section hidden">
        <div class="max-w-7xl mx-auto">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-building-circle-check text-sky-600"></i>
                พิจารณาโครงการระยะยาว</h1>
              <p class="text-xs text-slate-500 mt-1">งานที่ยังไม่เสร็จจะถูกดันขึ้นด้านบน (ติดดาว ⭐ และป้ายสีแดง)
                เรียงตามเวลาเก่าไปใหม่ งานที่เสร็จแล้วจะติดป้ายสีฟ้าและดันลงด้านล่าง</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400"></i>
                <input type="text" oninput="window.currentAdvFilters['project'].search = this.value; window.applyAdvFilters('project');"
                  class="pl-9 pr-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 w-full md:w-64"
                  placeholder="ค้นหาจากรายละเอียดปัญหา...">
              </div>
              <button onclick="loadAdvancedTasks()"
                class="bg-white border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-50 shadow-sm transition-colors"><i
                  class="fa-solid fa-rotate mr-1"></i> รีเฟรช</button>
              <button onclick="exportTableToCSV('projectBody', 'รายงานโครงการ.csv')"
                class="bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl text-sm font-bold text-emerald-700 hover:bg-emerald-100 shadow-sm transition-colors hidden sm:block"><i
                  class="fa-solid fa-file-csv mr-1"></i> ส่งออก CSV</button>
            </div>
          </div>
          
          <div class="flex flex-wrap items-center gap-3 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <span class="text-sm font-semibold text-slate-600"><i class="fa-solid fa-filter mr-1"></i> กรองข้อมูล:</span>
            <select onchange="window.currentAdvFilters['project'].date = this.value; window.applyAdvFilters('project');" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 bg-white">
              <option value="">ทุกช่วงเวลา</option>
              <option value="today">วันนี้</option>
              <option value="week">สัปดาห์นี้</option>
              <option value="month">เดือนนี้</option>
            </select>
            <input type="text" oninput="window.currentAdvFilters['project'].reporter = this.value; window.applyAdvFilters('project');" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 w-32 sm:w-40 bg-white" placeholder="ชื่อผู้แจ้ง...">
          </div>
          
          <div class="flex gap-2 border-b border-slate-200 mb-4 overflow-x-auto" id="projectManageTabs">
            <button class="px-4 py-2 font-bold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap" onclick="filterAdvTab('project', 'all', this)">ทั้งหมด</button>
            <button class="px-4 py-2 font-semibold text-slate-500 hover:text-slate-700 whitespace-nowrap" onclick="filterAdvTab('project', 'pending', this)">รอดำเนินการ</button>
            <button class="px-4 py-2 font-semibold text-slate-500 hover:text-slate-700 whitespace-nowrap" onclick="filterAdvTab('project', 'progress', this)">กำลังดำเนินการ</button>
            <button class="px-4 py-2 font-semibold text-slate-500 hover:text-slate-700 whitespace-nowrap" onclick="filterAdvTab('project', 'done', this)">เสร็จสิ้น</button>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div id="projectBody" class="flex flex-col divide-y divide-slate-100">
              <div class="p-8 text-center text-slate-500">กำลังโหลดข้อมูล...</div>
            </div>
          </div>
        </div>
      </div>
