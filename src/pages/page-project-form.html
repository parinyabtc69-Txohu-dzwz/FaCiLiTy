      <div id="page-project-form" class="page-section hidden">
        <div class="flex items-center justify-center min-h-[70vh] py-6">
          <div class="bg-white w-full max-w-2xl rounded-3xl shadow-sm p-6 sm:p-8 border border-slate-200">
            <button onclick="nav('page-home')"
              class="text-[#8b5cf6] font-bold mb-4 hover:text-[#7c3aed] transition-colors text-sm inline-flex items-center gap-1.5">
              <i class="fa-solid fa-arrow-left"></i> <span>กลับหน้าหลัก</span>
            </button>
            <div class="text-center mb-6">
              <div
                class="w-14 h-14 bg-[#ede9fe] text-[#8b5cf6] rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                <i class="fa-solid fa-building-circle-check"></i>
              </div>
              <h2 class="text-2xl font-bold text-slate-800">แจ้งโครงการระยะยาว / จัดซื้อ</h2>
              <p class="text-xs text-slate-500 mt-1">เสนอโครงการปรับปรุงสถานที่ จัดซื้อ หรือโครงการที่ต้องรอผู้อำนวยการอนุมัติ</p>
            </div>
            <form id="projectForm" class="space-y-4" onsubmit="event.preventDefault(); submitProject();">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อผู้เสนอโครงการ <span class="text-rose-500">*</span></label>
                <input type="text" id="projReporter" placeholder="เช่น สมชาย ใจดี"
                  class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm font-medium"
                  required>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">หน่วยงาน / แผนก</label>
                  <input type="text" id="projDepartment" placeholder="ถ้ามี เช่น ฝ่ายบริหารทั่วไป"
                    class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">สถานที่ดำเนินการ</label>
                  <div class="flex gap-2">
                    <input type="text" id="projLocation" placeholder="เช่น อาคาร 2 หรือ ทั้งโรงเรียน"
                      class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm">
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">ประเภทโครงการ <span class="text-rose-500">*</span></label>
                <select id="projSubject" class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm font-medium" required>
                  <option value="ปรับปรุงอาคาร / ทาสี / ต่อเติม">ปรับปรุงอาคาร / ทาสี / ต่อเติม</option>
                  <option value="ห้องน้ำ / ระบบประปาขนาดใหญ่">ห้องน้ำ / ระบบประปาขนาดใหญ่</option>
                  <option value="จัดซื้อครุภัณฑ์ / อุปกรณ์ล็อตใหญ่">จัดซื้อครุภัณฑ์ / อุปกรณ์ล็อตใหญ่</option>
                  <option value="ปรับภูมิทัศน์ / สวน">ปรับภูมิทัศน์ / สวน</option>
                  <option value="โครงการพิเศษ">โครงการพิเศษ</option>
                  <option value="อื่นๆ">อื่นๆ</option>
                </select>
              </div>

              

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold text-slate-700 mb-1">วันที่ต้องการให้แล้วเสร็จ <span class="text-slate-400 font-normal">(Target Date)</span></label>
                  <input type="date" id="projTargetDate"
                    class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">รายละเอียดโครงการ / เหตุผลความจำเป็น <span class="text-rose-500">*</span></label>
                <textarea id="projDetail" rows="3" placeholder="อธิบายสิ่งที่ต้องการทำ เหตุผล และงบประมาณคร่าวๆ (ถ้ามี)"
                  class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm" required></textarea>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">เบอร์โทรศัพท์ หรือช่องทางติดต่อ</label>
                <input type="text" id="projContact" placeholder="เช่น 081-234-5678"
                  class="w-full p-3 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#8b5cf6] bg-slate-50 text-sm">
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">เอกสารโครงการ / รูปภาพประกอบ (ถ้ามี)</label>
                <input type="file" id="projFile" accept=".pdf,image/*,.doc,.docx" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-[#ede9fe] file:text-[#8b5cf6] hover:file:bg-[#8b5cf6] hover:file:text-white file:transition-colors">
              </div>

              <button type="button" onclick="submitProject()" id="btnSubmitProject"
                class="w-full bg-[#8b5cf6] hover:bg-[#7c3aed] text-white font-bold py-3.5 rounded-xl flex justify-center items-center gap-2 transition-all shadow-md active:scale-[0.99] mt-2">
                <i class="fa-solid fa-paper-plane"></i> <span>ส่งเสนอโครงการ</span>
              </button>
            </form>
          </div>
        </div>
      </div>
