<!-- Firebase Unified Admin Dashboard -->
<div id="page-fb-admin" class="page-section hidden">
  <div class="max-w-7xl mx-auto p-4 md:p-6 pb-24">
    
    <div class="bg-gradient-to-r from-amber-500 to-amber-700 text-white p-6 md:p-8 rounded-3xl shadow-sm mb-8 flex justify-between items-center">
      <div>
        <div class="text-xs uppercase tracking-widest text-amber-200 font-semibold mb-1">ส่วนจัดการรวมศูนย์ (Firebase)</div>
        <h1 class="text-3xl font-bold"><i class="fa-solid fa-server mr-2"></i> ระบบติดตามงาน (Tracking)</h1>
      </div>
      
    </div>

    <!-- Controls -->
    <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
      <div class="flex gap-2">
        <select id="fb-admin-filter-type" onchange="loadFbAdminTickets()" class="p-2 border border-slate-200 rounded-xl bg-white text-sm outline-none focus:ring-2 focus:ring-amber-500">
          <option value="all">ทุกแผนก (All)</option>
          <option value="building">อาคารสถานที่</option>
          <option value="av">โสตทัศนูปกรณ์</option>
          <option value="it">ไอที / ซอฟต์แวร์</option>
          <option value="project">โครงการ</option>
        </select>
        
        <select id="fb-admin-filter-status" onchange="loadFbAdminTickets()" class="p-2 border border-slate-200 rounded-xl bg-white text-sm outline-none focus:ring-2 focus:ring-amber-500">
          <option value="all">ทุกสถานะ</option>
          <option value="รอมอบหมาย">รอมอบหมาย</option>
          <option value="รอช่างรับงาน">รอช่างรับงาน</option>
          <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
          <option value="เสร็จสิ้น">เสร็จสิ้น</option>
        </select>
      </div>
      
      <button onclick="loadFbAdminTickets()" class="bg-[#265D5A] hover:bg-[#1a3f3d] text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors">
        <i class="fa-solid fa-rotate-right mr-1"></i> รีเฟรชข้อมูล
      </button>
    </div>

    <!-- Ticket Grid -->
    <div id="fb-admin-ticket-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center p-8 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><br>กำลังโหลดข้อมูล...
      </div>
    </div>

  </div>
</div>
