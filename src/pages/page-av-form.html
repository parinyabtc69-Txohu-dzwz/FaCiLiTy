      <div id="page-av-form" class="page-section">
        <div class="flex items-center justify-center min-h-[70vh]">
          <div class="bg-white w-full max-w-lg rounded-3xl shadow-sm p-8 my-4 border border-slate-200">
            <button onclick="nav('page-home')"
              class="text-[#FF5F5F] font-bold mb-4 hover:text-[#8F1C26] transition-colors text-sm"><i
                class="fa-solid fa-house"></i> กลับหน้าหลัก</button>
            <div class="text-center mb-6">
              <div
                class="w-14 h-14 bg-[#FF5F5F]/10 text-[#FF5F5F] rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid fa-microphone-lines"></i>
              </div>
              <h2 class="text-2xl font-bold text-slate-800">ขอยืมอุปกรณ์โสตทัศนูปกรณ์</h2>
              <p class="text-xs text-slate-500 mt-1">กรุณาเลือกรายการอุปกรณ์และกรอกชื่อผู้ยืม</p>
            </div>
            <form id="avForm" class="space-y-5">
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">ชื่อผู้แจ้งยืม <span
                    class="text-red-500">*</span></label>
                <input type="text" id="borrower"
                  class="w-full p-3 border rounded-xl outline-none bg-slate-100 font-semibold text-slate-700" readonly
                  required>
              </div>
              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">อุปกรณ์ที่ต้องการ <span
                    class="text-red-500">*</span></label>
                <div class="grid grid-cols-1 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="equipment" value="ไมโครโฟนไร้สาย" class="w-5 h-5 accent-[#265D5A]" onchange="this.parentElement.querySelector('input[type=number]').disabled = !this.checked"> 
                    <span class="text-slate-700 flex-1">ไมโครโฟนไร้สาย</span>
                    <input type="number" min="1" max="99" value="1" disabled class="w-16 p-1 border rounded-lg text-center text-sm disabled:opacity-50">
                  </label>
                  <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="equipment" value="ลำโพงบลูทูธพกพา" class="w-5 h-5 accent-[#265D5A]" onchange="this.parentElement.querySelector('input[type=number]').disabled = !this.checked"> 
                    <span class="text-slate-700 flex-1">ลำโพงบลูทูธพกพา</span>
                    <input type="number" min="1" max="99" value="1" disabled class="w-16 p-1 border rounded-lg text-center text-sm disabled:opacity-50">
                  </label>
                  <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="equipment" value="ปลั๊กพ่วงสนาม" class="w-5 h-5 accent-[#265D5A]" onchange="this.parentElement.querySelector('input[type=number]').disabled = !this.checked"> 
                    <span class="text-slate-700 flex-1">ปลั๊กพ่วงสนาม</span>
                    <input type="number" min="1" max="99" value="1" disabled class="w-16 p-1 border rounded-lg text-center text-sm disabled:opacity-50">
                  </label>
                  <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="equipment" value="โน้ตบุ๊ก" class="w-5 h-5 accent-[#265D5A]" onchange="this.parentElement.querySelector('input[type=number]').disabled = !this.checked"> 
                    <span class="text-slate-700 flex-1">โน้ตบุ๊ก</span>
                    <input type="number" min="1" max="99" value="1" disabled class="w-16 p-1 border rounded-lg text-center text-sm disabled:opacity-50">
                  </label>
                  <div class="flex items-center gap-3 mt-1">
                    <span class="text-slate-400 text-sm">อื่นๆ:</span>
                    <input type="text" id="other_equip" placeholder="ระบุเพิ่มเติม..."
                      class="flex-1 bg-transparent border-b border-slate-300 outline-none text-sm focus:border-[#265D5A]">
                    <input type="number" id="qty_other" min="1" max="99" value="1" class="w-16 p-1 border rounded-lg text-center text-sm">
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">วันที่ใช้งาน <span
                      class="text-red-500">*</span></label>
                  <input type="date" id="useDate" class="w-full p-3 border rounded-xl outline-none bg-slate-50"
                    required>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">สถานที่ใช้งาน <span
                      class="text-red-500">*</span></label>
                  <input type="text" id="av_location" placeholder="เช่น ห้องประชุมใหญ่"
                    class="w-full p-3 border rounded-xl outline-none bg-slate-50" required>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">ลงชื่อผู้ยืม (พิมพ์ชื่อ - นามสกุล) <span
                    class="text-red-500">*</span></label>
                <input type="text" id="signerName" placeholder="ระบุชื่อ-นามสกุลเพื่อยืนยันการรับอุปกรณ์"
                  class="w-full p-3 border rounded-xl outline-none bg-slate-50 font-semibold text-slate-700" required>
              </div>

              <button type="button" onclick="submitAVForm()" id="btnSubmitAV"
                class="w-full bg-[#FF5F5F] hover:bg-[#8F1C26] text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-sm">
                <i class="fa-solid fa-paper-plane"></i><span>ยืนยันการขอยืมอุปกรณ์</span>
              </button>
            </form>
          </div>
        </div>
      </div>
